name: Scorecard

# OpenSSF Scorecard: rates the repository's supply-chain practices (pinned actions, branch protection, token
# permissions, and so on). Results go to the code-scanning page and to the public Scorecard API, for the badge.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
